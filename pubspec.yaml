name: bloom
description: "Bloom - Private Couples' Period Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  web_socket_channel: ^3.0.3
  intl: ^0.20.0
  file_picker: ^8.1.7
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  encrypt: ^5.0.3
  crypto: ^3.0.7
  http: ^1.6.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_markdown: ^0.7.7+1
  go_router: ^14.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#E85577"
  adaptive_icon_foreground: "assets/icon.png"
