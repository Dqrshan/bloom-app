<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85577"/>
      <stop offset="100%" style="stop-color:#D63D5F"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#FFF0F3;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Petals -->
  <g transform="translate(256,256)">
    <!-- 5 petals arranged in a flower -->
    <ellipse cx="0" cy="-70" rx="38" ry="72" fill="url(#petal)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-70" rx="38" ry="72" fill="url(#petal)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-70" rx="38" ry="72" fill="url(#petal)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-70" rx="38" ry="72" fill="url(#petal)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-70" rx="38" ry="72" fill="url(#petal)" transform="rotate(288)"/>
    <!-- Inner petals (smaller, rotated) -->
    <ellipse cx="0" cy="-48" rx="24" ry="46" fill="url(#petal)" transform="rotate(36)" opacity="0.8"/>
    <ellipse cx="0" cy="-48" rx="24" ry="46" fill="url(#petal)" transform="rotate(108)" opacity="0.8"/>
    <ellipse cx="0" cy="-48" rx="24" ry="46" fill="url(#petal)" transform="rotate(180)" opacity="0.8"/>
    <ellipse cx="0" cy="-48" rx="24" ry="46" fill="url(#petal)" transform="rotate(252)" opacity="0.8"/>
    <ellipse cx="0" cy="-48" rx="24" ry="46" fill="url(#petal)" transform="rotate(324)" opacity="0.8"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="20" fill="#E85577"/>
    <circle cx="0" cy="0" r="12" fill="#FFF0F3"/>
  </g>
</svg>
