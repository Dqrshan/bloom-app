<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching BloomColors.rose500 to rose600 -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05368" />
      <stop offset="100%" stop-color="#C9184A" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#700B2B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="512" height="512" rx="140" fill="url(#roseGrad)" />

  <!-- White Local Florist / Lotus Flower Icon matching Settings -->
  <g fill="#FFFFFF" filter="url(#iconShadow)" transform="translate(0, 10)">
    <!-- Center Lotus Petal -->
    <path d="M256 120 C290 185 315 250 256 340 C197 250 222 185 256 120 Z" />

    <!-- Left Main Petal -->
    <path d="M256 340 C175 330 130 250 160 170 C205 190 235 260 256 340 Z" opacity="0.95" />

    <!-- Right Main Petal -->
    <path d="M256 340 C337 330 382 250 352 170 C307 190 277 260 256 340 Z" opacity="0.95" />

    <!-- Left Outer Flared Petal -->
    <path d="M256 340 C155 350 95 285 110 230 C155 230 205 280 256 340 Z" opacity="0.85" />

    <!-- Right Outer Flared Petal -->
    <path d="M256 340 C357 350 417 285 402 230 C357 230 307 280 256 340 Z" opacity="0.85" />

    <!-- Base Pod / Calyx -->
    <path d="M200 348 C220 375 292 375 312 348 C280 358 232 358 200 348 Z" />
  </g>
</svg>
